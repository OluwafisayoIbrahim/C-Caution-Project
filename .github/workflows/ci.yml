name: CI

on:
  push:
  pull_request:

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate netlist and run host checks
        run: make all

  arduino-uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
      - name: Compile for Arduino Uno
        run: arduino-cli compile --fqbn arduino:avr:uno firmware/c_caution
